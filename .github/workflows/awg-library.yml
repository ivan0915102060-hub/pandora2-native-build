name: PANDORA AWG library qualification v1
on:
  workflow_dispatch:
    inputs:
      sdk_terms_accepted:
        description: Administrator has reviewed and accepted the Android SDK terms for this run
        required: true
        type: boolean
        default: false
      free_budget_confirmed:
        description: Free Actions allowance and zero paid spending have been confirmed
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pandora-awg-library-v1
  cancel-in-progress: false
jobs:
  library:
    if: ${{ inputs.sdk_terms_accepted && inputs.free_budget_confirmed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      SOURCE_COMMIT: 5c16489e2cd9ed3a0a7a27c7445bba5238132f86
      JDK_URL: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz
      JDK_SHA256: d7f5d5cf865a2902b70ff549b97586a7d3f234e016f041ab447ea740c7d66d1c
      SDK_URL: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
      SDK_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
      GRADLE_SHA256: 20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
    steps:
      - name: Prepare isolated directories and public source
        shell: bash
        run: |
          set -euo pipefail
          for tool in git curl tar unzip sha256sum make flock patch cc; do command -v "$tool" >/dev/null; done
          test "$(uname -m)" = x86_64
          # CI-only qualification budget; not the separate Windows tool estimate or NAS limits.
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 12582912
          WORK="$RUNNER_TEMP/pandora-awg-library-v1"
          test ! -e "$WORK"
          mkdir -m 700 "$WORK"
          mkdir "$WORK/downloads" "$WORK/jdk" "$WORK/sdk" "$WORK/sdk/cmdline-tools" "$WORK/gradle-cache" "$WORK/artifacts"
          printf 'WORK=%s\nJAVA_HOME=%s\nANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nGRADLE_USER_HOME=%s\n' "$WORK" "$WORK/jdk" "$WORK/sdk" "$WORK/sdk" "$WORK/gradle-cache" >> "$GITHUB_ENV"
          git init "$WORK/source"
          git -C "$WORK/source" remote add origin https://github.com/amnezia-vpn/amneziawg-android.git
          git -C "$WORK/source" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$WORK/source" checkout --detach FETCH_HEAD
          test "$(git -C "$WORK/source" rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C "$WORK/source" -c protocol.file.allow=never submodule update --init --recursive
          git -C "$WORK/source" submodule status --recursive > "$WORK/artifacts/submodules.txt"
          if grep -Eq '^[-+U]' "$WORK/artifacts/submodules.txt"; then exit 1; fi
      - name: Verify bootstrap archives before use
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 "$JDK_URL" -o "$WORK/downloads/jdk.tar.gz"
          printf '%s  %s\n' "$JDK_SHA256" "$WORK/downloads/jdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$WORK/downloads/jdk.tar.gz" -C "$JAVA_HOME" --strip-components=1
          curl --fail --location --proto '=https' --tlsv1.2 "$SDK_URL" -o "$WORK/downloads/sdk.zip"
          printf '%s  %s\n' "$SDK_SHA256" "$WORK/downloads/sdk.zip" | sha256sum --check --strict
          unzip -q "$WORK/downloads/sdk.zip" -d "$WORK/sdk-unpack"
          mv "$WORK/sdk-unpack/cmdline-tools" "$ANDROID_HOME/cmdline-tools/22.0"
          "$JAVA_HOME/bin/java" -version
          grep -Eq '^JAVA_VERSION="21\.0\.13"' "$JAVA_HOME/release"
          grep -Eq '^Pkg.Revision=22\.0(\.0)?$' "$ANDROID_HOME/cmdline-tools/22.0/source.properties"
          printf 'PATH=%s/bin:%s\n' "$JAVA_HOME" "$PATH" >> "$GITHUB_ENV"
      - name: Install only approved SDK packages in the ephemeral workspace
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager"
          # These answers are permitted only by the explicit administrator input above.
          for unused in $(seq 1 100); do printf 'y\n'; done | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list_installed > "$WORK/artifacts/sdk-packages.txt"
          test "$(df -Pk "$WORK" | awk 'NR==2 {print $4}')" -ge 2097152
      - name: Build only the unsigned library
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/source"
          grep -Fq 'gradle-8.13-bin.zip' gradle/wrapper/gradle-wrapper.properties
          printf '\ndistributionSha256Sum=%s\n' "$GRADLE_SHA256" >> gradle/wrapper/gradle-wrapper.properties
          chmod u+x gradlew
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m' :tunnel:assembleRelease
          test -f tunnel/build/outputs/aar/tunnel-release.aar
          cp tunnel/build/outputs/aar/tunnel-release.aar "$WORK/artifacts/awg-tunnel-v3.1.20260814.aar"
          cp COPYING "$WORK/artifacts/SOURCE-COPYING"
          printf 'source_commit=%s\nqualification_only=true\nformal_secrets_used=false\n' "$SOURCE_COMMIT" > "$WORK/artifacts/build-scope.txt"
          "$JAVA_HOME/bin/java" -version 2> "$WORK/artifacts/java-version.txt"
          ./gradlew --no-daemon --version > "$WORK/artifacts/gradle-version.txt"
          git diff -- gradle/wrapper/gradle-wrapper.properties > "$WORK/artifacts/wrapper-checksum-change.diff"
          cd "$WORK/artifacts"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Upload only the isolated library and public build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pandora-awg-library-qualification-v1
          path: ${{ env.WORK }}/artifacts/
          if-no-files-found: error
          retention-days: 1
